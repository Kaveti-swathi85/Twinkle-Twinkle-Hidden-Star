
<!DOCTYPE html>
<html>
<head>
<title>Cyber CTF Challenge</title>

<style>
body {
    background: #101827;
    color: white;
    font-family: Arial;
    text-align: center;
    padding-top: 100px;
}

.container {
    background: #1e293b;
    padding: 30px;
    width: 300px;
    margin: auto;
    border-radius: 12px;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 5px;
    border: none;
}

button {
    padding: 12px 30px;
    background: #16a34a;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

#flag {
    display: none;
    color: #22c55e;
    font-size: 22px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container" id="login">
    <h2>🔐 CTF Login Portal</h2>
    <p>Enter credentials to find the flag</p>

    <input type="text" id="username"
    placeholder="Username">

    <input type="password" id="password"
    placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p id="message"></p>
</div>

<div class="container" id="success"
style="display:none;">

    <h2>🎉 Login Successful!</h2>
    <p>Congratulations! You found the flag.</p>

    <div id="flag">
        FLAG{Twinkle_Twinkle_Little_Star}
    </div>
</div>

<script>

function login() {

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "star123") {

        document.getElementById("login").style.display = "none";

        document.getElementById("success").style.display = "block";

        document.getElementById("flag").style.display = "block";

    } else {

        document.getElementById("message").innerHTML =
        "❌ Invalid Username or Password";

    }
}

</script>

</body>
</html>
